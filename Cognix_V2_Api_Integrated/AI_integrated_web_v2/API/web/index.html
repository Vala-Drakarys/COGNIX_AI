/* COGNIX white + pastel blue redesign */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --panel:#f8fcfe;
  --edge:#d4e4f0;
  --text:#1a2e3d;
  --muted:#6b8aa3;
  --accent:#7fc8f8;
  --purple:#7fc8f8;
  --green:#6fb8e8;
  --amber:#d4c47a;
  --red:#e8a8a8;
  --cream:#ffffff;
  --cream-2:#f0f7fc;
  --olive:#6fb8e8;
  --olive-dark:#3d6b9e;
  --olive-soft:#e8f2fa;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
html{background:var(--bg)}
body{background:radial-gradient(circle at 85% -10%,#e8f2fa 0,transparent 33%),linear-gradient(180deg,#f8fcfe 0%,#f0f7fc 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline-color:var(--olive)}
.shell{grid-template-columns:238px minmax(0,1fr)}
.side{background:rgba(248,252,254,.92);border-right:1px solid var(--edge);padding:30px 20px;box-shadow:8px 0 30px rgba(61,107,158,.035);backdrop-filter:blur(18px)}
.logo{color:var(--olive-dark);font-size:20px;letter-spacing:3px;padding:0 9px}
.logomark{background:var(--olive);color:#ffffff;width:34px;height:34px;border-radius:11px;box-shadow:0 6px 14px rgba(111,184,232,.18)}
.brandcaption{color:#8aa3b8;margin-bottom:38px}
.nav{gap:5px}.nav button{color:#748aa3;border-radius:12px;padding:11px 13px}.nav button:hover{background:#eef0f7;color:var(--olive-dark)}
.nav button.active{background:#e7eef7;border-color:#d4e0ed;color:var(--olive-dark);font-weight:700}
.navicon{color:var(--olive)}
.sidefoot{padding-top:20px}.sidefoot p{color:#8598a8}.avatar{background:var(--olive-dark);color:#ffffff}
.learner strong{color:var(--olive-dark)}.tiny{color:#8398a3}
.page{background:transparent}.topbar{height:72px;background:rgba(248,252,254,.62);border-bottom:1px solid var(--edge);backdrop-filter:blur(18px);padding:0 36px}
.breadcrumb{color:#8aa3b8}.breadcrumb strong{color:var(--olive-dark)}
.pill{border-color:#d4e4f0;background:#f0f7fc;color:var(--olive-dark)}
.pill.purple,.pill.green{background:#e7eef7;color:#4a7ca8;border-color:#d0e0ed}.pill.amber{background:#f5f0d5;color:#87792f;border-color:#e5d4aa}.pill.red{background:#f4e8e8;color:#a85d5d;border-color:#e4c4c4}
.btn{background:#f8fcfe;border-color:#d4e4f0;color:var(--olive-dark);border-radius:11px;box-shadow:0 2px 7px rgba(61,107,158,.04)}
.btn:hover{background:#f0f7fc;border-color:#bdd5e8}.btn.primary{background:var(--olive);border-color:var(--olive);color:#ffffff;box-shadow:0 8px 20px rgba(111,184,232,.18)}.btn.primary:hover{background:#5a9fd8}.btn.ghost{background:transparent;color:#6d8aa8}.btn.danger{color:#a85d5d;border-color:#ddc5c5}
.content{padding:38px 42px 58px;max-width:1540px}
.titlebar{margin-bottom:30px}.eyebrow{color:#7b94b4;letter-spacing:2px}.titlebar h1{color:var(--olive-dark);font-size:38px;letter-spacing:-1.5px}.subtitle{color:#7388a3;font-size:15px;max-width:720px}
.card{background:rgba(248,252,254,.88);border:1px solid var(--edge);border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(61,107,158,.055);backdrop-filter:blur(14px)}
.card.flat{background:rgba(248,252,254,.85)}
h2{color:var(--olive-dark)}h3{color:#486b9e}.label{color:#8096b0}.field{color:#697d99}
textarea,input,select{background:#fbfdfd;border:1px solid #d1e1f1;color:var(--text);border-radius:11px}textarea:focus,input:focus,select:focus{border-color:#9bc9e8;box-shadow:0 0 0 3px #e7eef7}
textarea::placeholder,input::placeholder{color:#a1b1c1}.rule{border-top-color:#e1ebf1}
.nextaction{background:linear-gradient(135deg,#eef0f7 0%,#f8fcfe 70%);border-color:#cfe8f5}.nextaction p{color:var(--olive-dark);font-size:21px}
.module{background:#fbfdfd;border-color:#deeaf0;border-radius:15px;color:var(--text);padding:19px}.module:hover{border-color:#aad5e8;background:#f1f5f8;transform:translateY(-1px);box-shadow:0 8px 20px rgba(61,107,158,.07)}
.statcard{background:rgba(248,252,254,.72)}.statcard strong{color:var(--olive-dark)}
.number{background:#f5f8fc;border-color:#e1ebf1}.number strong{color:var(--olive-dark)}
.attempt{color:#a86d6d}.callout{border-left-color:var(--olive);color:#667d96;background:#f3f7fa;padding:8px 12px;border-radius:0 9px 9px 0}
.notice{border-color:#cfe8f5;background:#eef0f7;color:#5d759d}.notice.warn{color:#82772e;background:#f8f3db;border-color:#e5d3aa}.notice.error{color:#a85d5d;background:#f4e8e8;border-color:#e2c4c4}
.active-question{border-color:#9dd5e8;box-shadow:0 0 0 4px #e8f2fa}.questiontext{color:var(--olive-dark)}
.answers .option,.option{background:#fbfdfd;border-color:#ddeaf0;color:#596d99;border-radius:11px}.option:hover,.option.selected{border-color:#9ad5e8;background:#edf2fa;color:var(--olive-dark)}
.timeline{scrollbar-color:#aad5e8 transparent}.event{border-left-color:#d0dee8}.event:before{background:#aeb8d8;border-color:#f8fcfe}.event.success:before{background:var(--olive)}.event.success .eventhead{color:#4d7db8}.event.rejected:before,.event.warning:before{background:#b3a049}.event.rejected .eventhead,.event.warning .eventhead{color:#87792f}.event.revision:before,.event.memory:before{background:#7d9bd8}.event.revision .eventhead,.event.memory .eventhead{color:#6679b6}.event .eventhead{color:#8598a8}.event p{color:#7388a3}.event.quote p{background:#f3f6f8;border-color:#e0e8f0;color:#5f759f}
.confidence .bar{background:#deeaf0}.confidence .bar span{background:var(--olive)}
.hyp-id{background:#e8f2fa;color:#5976b9;border-color:#d1e9f1}.support li{color:#667d96}.support .yes{color:#4d7db8}.support .no{color:#97843b}
.tree li,.historyitem,.listitem,.task{border-color:#e2ebf2}.task{background:#fafbfc}.task button{border-color:#cde5f0;color:var(--olive)}
.resource{background:linear-gradient(135deg,#f0f7fc,#f8fcfe);border-color:#d4e8f0}
.nextaction .pill{background:#e7eef7}
.emptyglyph{border-color:#cfe6f0;color:var(--olive);background:#f0f7fc}
code,pre{background:#f0f7fc;color:#556d95;border-color:#ddeaf0}
summary{color:#657db5}

</style></head><body><div class="shell"><aside class="side"><div class="logo"><span class="logomark">C</span>COGNIX</div><div class="brandcaption">ACADEMIC DIAGNOSTIC AGENT</div><nav class="nav" aria-label="Main"><button data-view="dashboard"><span class="navicon">▦</span>Overview</button><button data-view="workspace" class="active"><span class="navicon">◎</span>Diagnostic lab</button><button data-view="memory"><span class="navicon">▤</span>Student memory</button><button data-view="guide"><span class="navicon">▷</span>Demo & setup</button></nav><div class="sidefoot"><p>Investigate the mistake.<br>Test the assumption.<br>Remember the evidence.</p><div class="learner"><div class="avatar" id="avatar">PS</div><div><strong id="student-name">Practice Student</strong><span class="tiny" id="storage-label">Persistent profile</span></div></div></div></aside><div class="page"><header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Diagnostic lab</strong></div><div class="topactions"><span id="service-badge" class="pill">Checking service</span><button class="btn small" data-action="switch-profile" id="switch-profile">Use demo profile</button><button class="btn primary small" data-action="demo-start">▷ Demo Mode</button></div></header><main class="content"><div id="error" role="alert"></div><div id="app"><div class="loader"><span class="spinner"></span>Loading your saved learning profile…</div></div></main></div></div><script>
'use strict';
let state=null,view='workspace',space=new URLSearchParams(location.search).get('profile')==='demo'?'demo':'practice',busy=false,auto=false,autotimer=null,selectedChoice=null,selectedModule='exam',draft='',requestId=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const pill=(text,tone='')=>'<span class="pill '+tone+'">'+esc(text)+'</span>';
const button=(text,action,primary=false)=>'<button class="btn '+(primary?'primary':'')+'" data-action="'+action+'">'+text+'</button>';
function showError(t,reload=false){$('#error').innerHTML='<div class="notice error">'+esc(t)+(reload?' <button class="link" data-action="reload">Reload saved session</button>':'')+'</div>';}
async function load(){try{const res=await fetch('/api/profile?profile='+space);const data=await res.json();if(!res.ok)throw new Error(data.error);state=data;$('#error').innerHTML='';render();}catch(e){showError(e.message,true);$('#app').innerHTML='<div class="loader">Your saved session is unavailable. Reload when the connection returns.</div>';}}
async function checkAgentBackend(){const el=$('#agent-backend-status');if(!el)return;try{const r=await fetch('/api/agent/health');const d=await r.json();el.className='backend-status online';el.innerHTML='<span class="status-dot"></span><span>Agent backend online · '+esc(d.service||'Diagnostic Agent')+'</span>';}catch{el.className='backend-status offline';el.innerHTML='<span class="status-dot"></span><span>Agent backend offline · run <code>npm run backend:dev</code></span>';}}
async function act(payload){if(busy)return false;busy=true;$('#service-badge').textContent='Processing evidence…';document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#error').innerHTML='';try{const res=await fetch('/api/action?profile='+space,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,revision:state.profile.revision,request_id:requestId||(requestId=crypto.randomUUID())})});const result=await res.json();if(!res.ok){requestId=null;throw Object.assign(new Error(result.error),{reload:result.reload});}state=result;requestId=null;draft='';selectedChoice=null;render();return true;}catch(e){auto=false;clearTimeout(autotimer);showError(e.message||'Connection interrupted. Your answer remains here. Reload to check what was saved.',true);return false;}finally{busy=false;$('#service-badge').textContent=state.service.configured?'AI available':'Reviewed engine · no AI key';document.querySelectorAll('button').forEach(b=>b.disabled=false);updateAutoControls();}}
function updateAutoControls(){const b=$('[data-action="demo-toggle"]');if(b)b.textContent=auto?'Pause demo':'Continue demo';}
function stats(){const p=state.profile;return '<div class="statgrid">'+[['Confirmed gaps',state.dashboard.active_gaps.length,'Student-confirmed · evidence-linked'],['Investigations',p.diagnostic_history.length,'History survives restarts'],['Checks completed',p.diagnostic_history.reduce((n,r)=>n+r.attempts,0),'Responses, not assumptions'],['Unresolved',p.unresolved_hypotheses.length,'Uncertainty stays visible']].map(([a,b,c])=>'<section class="card statcard"><div class="label">'+a+'</div><strong>'+b+'</strong><span>'+c+'</span></section>').join('')+'</div>';}
function title(eyebrow,h,p,extra=''){return '<div class="titlebar"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+h+'</h1><p class="subtitle">'+p+'</p></div>'+extra+'</div>';}
function resources(runId){const items=state.profile.interventions.filter(i=>!runId||i.run_id===runId);if(!items.length)return '';return items.slice(-2).map(i=>'<section class="card resource"><div class="label">After confirmation · targeted intervention</div><h2>'+esc(i.title)+'</h2><p class="small muted">'+esc(i.text)+'</p><div class="row"><span class="tiny">Did this help?</span>'+['Helped','Did not help','Not tried'].map(v=>'<button class="btn small '+(i.outcome===v?'primary':'ghost')+'" data-feedback="'+v+'" data-id="'+i.id+'">'+v+'</button>').join('')+'</div></section>').join('');}
function overview(){const p=state.profile,d=state.dashboard;return '<section class="hero"><div><div class="eyebrow">COGNIX · intelligent learning</div><h1>Understand the gap.<br><em>Then learn from it.</em></h1><p>COGNIX investigates how you solve problems, tests possible causes and turns evidence into your next learning step.</p><div class="row">'+button(state.run&&state.run.state!=='FINISH'?'Resume investigation':'Start an investigation','workspace',true)+'<span class="hero-note">AI-assisted when enabled · deterministic by default</span></div></div><div class="hero-orbit"><div class="orbit-ring r1"></div><div class="orbit-ring r2"></div><div class="orbit-core">C</div><span class="orbit-label l1">Observe</span><span class="orbit-label l2">Test</span><span class="orbit-label l3">Learn</span></div></section>'+title('Your learning, investigated','A clearer next step.','Your priorities come from saved evidence, unresolved gaps and upcoming tasks.',pill(space==='demo'?'SCRIPTED DEMO PROFILE':'PRACTICE PROFILE','purple'))+stats()+'<div class="dashgrid"><div><section class="card nextaction"><div class="label">Recommended next action</div><p>'+esc(d.recommended)+'</p><div class="row">'+button(state.run&&state.run.state!=='FINISH'?'Resume investigation':'Open diagnostic lab','workspace',true)+pill('Based on saved student state','purple')+'</div></section><section class="card"><h2>Choose an investigation</h2><div class="modules">'+Object.entries(state.modules).map(([id,m])=>'<button class="module" data-module="'+id+'"><strong>'+esc(m.title)+'</strong><span>'+esc(m.description)+'</span></button>').join('')+'</div></section>'+resources()+'</div><div><section class="card"><h2>Upcoming academic tasks</h2>'+(p.tasks.length?p.tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><button aria-label="'+(t.done?'Mark incomplete':'Complete task')+'" data-task="'+t.id+'">'+(t.done?'✓':'')+'</button><span class="grow">'+esc(t.title)+'<small>'+esc(t.due)+'</small></span></div>').join(''):'<p class="empty">Add a real deadline to connect your next action to upcoming work.</p>')+'<form id="task-form" style="margin-top:15px"><label class="field">Task<input name="title" required maxlength="100" placeholder="Physics quiz — Newton’s laws"></label><label class="field">Due date<input name="due" type="date" required></label><button class="btn small" type="submit">Add task</button></form></section><section class="card"><h2>Recent mistakes</h2>'+(d.recent_mistakes.length?d.recent_mistakes.map(e=>'<div class="listitem"><strong>'+esc(state.catalog[e.hypothesis].skill)+'</strong><p>“'+esc(e.response)+'”</p><span class="tiny">'+fmt(e.at)+' · '+esc(e.source)+'</span></div>').join(''):'<p class="empty">No incorrect observations recorded. One mistake never becomes a permanent label.</p>')+'</section></div></div>';}
function editor(){return '<section class="card"><div class="label">Student submission</div><form id="start-form"><label class="field">Investigation<select name="module" id="module-select">'+Object.entries(state.modules).map(([id,m])=>'<option value="'+id+'" '+(selectedModule===id?'selected':'')+'>'+esc(m.title)+'</option>').join('')+'</select></label><label class="field">'+(selectedModule==='friction'?'What happened in your study session?':'Exam question')+'<textarea name="question" required maxlength="2500" rows="5">'+esc(selectedModule==='friction'?'I planned to study this chapter but stopped after 20 minutes.':state.defaults.question)+'</textarea></label><label class="field">'+(selectedModule==='friction'?'What did you try?':'Your attempted answer')+'<textarea name="attempt" required maxlength="1500" rows="2">'+esc(selectedModule==='friction'?'I opened my notes but could not finish the first question.':state.defaults.attempt)+'</textarea></label><label class="field">Engine<select name="mode"><option value="practice">Reviewed diagnostic engine</option><option value="live" '+(!state.service.configured?'disabled':'')+'>AI-assisted engine'+(!state.service.configured?' — key required':'')+'</option></select></label><button class="btn primary" type="submit" style="width:100%">Investigate this mistake</button></form><p class="toolbar-note">Physics scope: force in N, mass in kg, acceleration. You can change the values. Other subjects are outside this MVP.</p></section>';}
function inputCard(r){return '<section class="card"><div class="row between"><div class="label">Student submission</div>'+pill(r.mode==='demo'?'DEMO':r.mode==='live'?'AI ASSISTED':'PRACTICE','purple')+'</div><p class="problem">'+esc(r.input.question)+'</p><hr class="rule"><div class="label">Attempted answer</div><div class="attempt">'+esc(r.input.attempt)+'</div><div class="callout">An incorrect answer is an observation. It does not tell us the cause.</div><div class="kv"><span>Subject</span><span>'+ (r.module==='friction'?'Study habits':'Physics')+'</span></div><div class="kv"><span>Investigation</span><span>'+esc(r.module)+'</span></div><hr class="rule">'+(r.state==='FINISH'?button('New investigation','new'):button('Stop investigation','stop'))+'</section>';}
function memoryNotice(r){return r.memory?'<section class="card"><div class="label" style="color:var(--accent)">↳ Memory loaded</div><p class="small">Previous '+(r.memory.gap?'confirmed gap: <strong>'+esc(r.memory.gap)+'</strong>':'unresolved hypothesis loaded')+'</p><p class="tiny">Previously rejected: '+esc(r.memory.rejected.join('; ')||'None')+'</p><div class="callout"><strong>Next action</strong><br>'+esc(r.memory.next)+' check</div></section>':'';}
function timeline(r){const events=r?.events||[];return '<section class="card"><div class="row between"><h2 style="margin:0">Investigation timeline</h2>'+pill('LIVE AGENT LOOP','green')+'</div><p class="toolbar-note">Controller events and observed evidence—not private model reasoning.</p>'+(events.length?'<ol class="timeline" id="timeline">'+events.map(e=>'<li class="event '+e.tone+' '+(/RESPONSE/.test(e.type)&&!/MODEL/.test(e.type)?'quote':'')+'"><div class="eventhead">'+esc(e.type.replaceAll('_',' '))+'</div><p>'+esc(e.text)+'</p></li>').join('')+'</ol>':'<div class="empty"><div class="emptyglyph">◎</div>Submit a question or run Demo Mode.<br>The agent’s questions, evidence and revisions will appear here.</div><div class="row">'+pill('HYPOTHESIS')+pill('TEST')+pill('REVISE')+pill('REMEMBER')+'</div>')+'</section>';}
function interaction(r){if(!r)return '<section class="card flat"><h2>Investigate before explaining.</h2><p class="small muted">The controller tests a possible cause, checks the response and changes direction when evidence disagrees. Resources only appear after a diagnosis is confirmed.</p></section>';
 if(r.state==='WAIT_FOR_STUDENT'){const q=r.question;return '<section class="card active-question"><div class="row between"><div class="label" style="margin:0">Diagnostic check '+(r.attempts+1)+'</div>'+pill(q.source,'purple')+'</div>'+(q.generated_wording?'<p class="tiny" style="margin-top:14px">AI phrasing: '+esc(q.generated_wording)+'</p><div class="label">Verified check</div>':'')+'<h2 class="questiontext">'+esc(q.prompt)+'</h2><form id="answer-form"><label class="sr" for="answer-text">Your answer</label><textarea id="answer-text" name="answer" class="answerbox" maxlength="1000" placeholder="Explain your answer, or choose an option below…">'+esc(draft)+'</textarea><div class="answers">'+[...q.choices,'I’m not sure'].map((c,i)=>'<button class="option" type="button" data-choice="'+i+'">'+esc(c)+'</button>').join('')+'</div><div class="row between"><button class="btn primary" type="submit">Submit evidence →</button><span class="tiny">Saved after every answer</span></div></form></section>';}
 if(r.state==='WAIT')return '<section class="card confirmbox"><div class="label">Student confirmation required</div><h2>Does this diagnosis match what you found difficult?</h2><p class="small muted">The evidence suggests <strong>'+esc(state.catalog[r.hypothesis].gap.toLowerCase())+'</strong>. You can disagree; the agent will investigate another possibility within its limits.</p><div class="row"><button class="btn primary" data-confirm="yes">Yes, that matches</button><button class="btn" data-confirm="no">No — investigate further</button><button class="btn ghost" data-confirm="unsure">Not sure</button></div><p class="toolbar-note">No response remains pending. Student agreement is stored separately from evidence strength.</p></section>';
 const good=r.outcome==='confirmed';return '<section class="card '+(good?'result':'')+'"><div class="label">'+(good?'✓ Diagnosis confirmed':r.outcome==='no_gap_observed'?'No consistent gap established':'Evidence insufficient — safe stop')+'</div><h2>'+esc(good?state.catalog[r.hypothesis].gap:r.outcome==='no_gap_observed'?'No diagnosis was manufactured.':'More evidence is needed.')+'</h2><p class="small muted">'+(good?'The student agrees with this evidence-backed hypothesis. Confidence is medium, not certainty.':'This session ended without a confirmed diagnosis. Uncertainty and disagreements remain in the record.')+'</p><div class="kv"><span>Student confirmation</span><span>'+esc(r.confirmation==='yes'?'✓ Confirmed':r.confirmation==='no'?'Rejected':r.confirmation==='unsure'?'Not sure':'Not given')+'</span></div><div class="kv"><span>Direct supporting observations</span><span>'+r.evidence.filter(e=>e.hypothesis===r.hypothesis&&e.result==='fail').length+'</span></div><div class="kv"><span>Rejected hypotheses</span><span>'+r.rejected.length+'</span></div><div class="row" style="margin-top:18px">'+button('Start a return visit','return',true)+button('Inspect memory','memory')+'</div></section>'+resources(r.id);}
function hypothesis(r){if(!r)return '<section class="card"><div class="label">Possible causes</div>'+['concept','calculation','application','units'].map(h=>'<div class="listitem"><span class="hyp-id">'+state.catalog[h].id+'</span><h3>'+esc(state.catalog[h].title)+'</h3><span class="tiny">Untested hypothesis</span></div>').join('')+'</section>';const h=state.catalog[r.hypothesis];return '<section class="card"><div class="label">Current hypothesis</div><span class="hyp-id">'+esc(h?.id||'—')+'</span><h2>'+esc(h?.title||'None established')+'</h2><div class="confidence"><div class="kv"><span>Evidence confidence</span><strong>'+esc(r.confidence)+'</strong></div><div class="bar"><span style="width:'+(r.confidence==='Medium'?60:r.confidence==='Low'?25:5)+'%"></span></div></div><p class="tiny">A qualitative evidence label, not a calibrated probability.</p><hr class="rule"><div class="label">Observed evidence</div><ul class="support">'+(r.evidence.length?r.evidence.map(e=>'<li><span class="'+(e.result==='pass'?'yes':'no')+'">'+(e.result==='pass'?'✓':e.result==='fail'?'!':'?')+'</span><span>'+esc(state.catalog[e.hypothesis].skill)+'<br><span class="tiny">'+(e.result==='pass'?'Demonstrated on this check':e.result==='fail'?'Incorrect response observed':'Evidence uncertain')+'</span></span></li>').join(''):'<li>No student evidence yet.</li>')+'</ul></section><section class="card flat"><div class="label">Controller boundaries</div><div class="numbers"><div class="number"><strong>'+r.attempts+'</strong><small> / 6</small><div class="tiny">Checks</div></div><div class="number"><strong>'+r.revisions+'</strong><small> / 3</small><div class="tiny">Revisions</div></div></div><div class="kv"><span>Model calls, including retries</span><span>'+r.model_calls+' / 12</span></div><div class="kv"><span>Current state</span></div><div class="tiny" style="font-family:var(--mono);word-break:break-word">'+esc(r.state)+'</div><p class="toolbar-note">The controller owns transitions, limits, confirmation and storage. Model output is schema-validated.</p></section>';}
function workspace(){const r=state.run;const isNew=!r||window.newInvestigation;return title('Physics / Newton’s second law',isNew?'Exam Mistake Detective':state.modules[r.module].title,'Don’t just find the wrong answer. Find out why it happened.',r&&!isNew?pill('REVISION '+r.revisions+'/3','purple'):'')+(space==='demo'?'<div class="notice row between"><span><strong>Deterministic Demo Mode.</strong> Student answers and “Yes” confirmation are scripted and labelled. The real controller and database are used.</span><div class="row">'+(r?.demo_encounter===2?pill('SECOND ENCOUNTER · MEMORY USED','green'):button(auto?'Pause demo':'Continue demo','demo-toggle'))+(r?.demo_encounter===2?'':button('One step','demo-step'))+'</div></div>':'')+(r?.mode==='live'&&!state.service.configured?'<div class="notice warn">Live AI is not configured. The reviewed engine is being used.</div>':'')+'<div class="workspace"><div class="leftcol">'+(isNew?editor():inputCard(r)+memoryNotice(r))+'</div><div class="centercol">'+timeline(isNew?null:r)+interaction(isNew?null:r)+'</div><div class="rightcol">'+hypothesis(isNew?null:r)+'</div></div>';}
function memory(){const p=state.profile;return title('Persistent student state','Evidence that carries forward.','The profile stores observations, rejected hypotheses and student-confirmed gaps. A later success can update an earlier concern.',button('Export JSON','export'))+'<div class="profilegrid"><div><section class="card"><div class="row between"><h2>Learning profile</h2>'+pill(space==='demo'?'DEMO STUDENT':'PRACTICE STUDENT','purple')+'</div><div class="label">Physics & study skills</div><ul class="tree">'+(['Formula recall','Basic division','Formula application','Unit handling','Question interpretation','Concept connection','Study focus','Task planning'].map(skill=>{const t=p.topics[skill];return '<li><div class="row"><strong>'+skill+'</strong>'+pill(t?(t.status.startsWith('Demonstrated')?'✓ Checked':t.status==='Uncertain'?'? Uncertain':'! Investigate'):'? Not checked',t?(t.status.startsWith('Demonstrated')?'green':'amber'):'')+'</div><p>'+esc(t?.status||'No evidence yet')+(t?' · '+t.checks.length+' observation(s)':'')+'</p></li>';}).join(''))+'</ul><hr class="rule"><div class="tiny">Last updated: '+fmt(p.last_updated)+'<br>Stored in '+esc(state.service.storage.toLowerCase())+'. Browser identity keeps this profile separate.</div></section><section class="card"><h2>Confirmed gaps</h2>'+(p.confirmed_gaps.length?p.confirmed_gaps.map(g=>'<div class="listitem"><div class="row between"><strong>'+esc(g.label)+'</strong>'+pill(g.status,g.status==='Active'?'amber':'green')+'</div><p>'+esc(g.confidence)+' confidence · '+g.evidence_ids.length+' supporting checks · student agreed</p></div>').join(''):'<p class="empty">Nothing confirmed yet. Resources stay gated until the student agrees with a supported hypothesis.</p>')+'</section><section class="card"><h2>Rejected & unresolved</h2>'+p.rejected_hypotheses.slice(-8).map(h=>'<div class="listitem"><strong>'+esc(state.catalog[h.hypothesis].title)+'</strong><p>'+esc(h.reason)+'</p>'+pill('Rejected / contradicted','amber')+'</div>').join('')+(p.unresolved_hypotheses.length?'<p class="small muted" style="margin-top:16px">'+p.unresolved_hypotheses.length+' investigation(s) remain unresolved, unconfirmed or in progress.</p>':'<p class="empty">No unresolved investigation recorded.</p>')+'</section></div><div><section class="card"><h2>Diagnostic history</h2>'+(p.diagnostic_history.length?p.diagnostic_history.slice().reverse().map(r=>'<article class="historyitem"><div class="row between"><strong>'+esc(state.modules[r.module].title)+'</strong>'+pill(r.mode==='demo'?'SCRIPTED DEMO':r.mode==='live'?'AI ASSISTED':'PRACTICE','purple')+'</div><p>'+fmt(r.created_at)+' · '+r.attempts+' checks · '+r.revisions+' revisions</p><div class="tiny">'+esc(r.outcome||r.state)+' · confirmation: '+esc(r.confirmation)+'</div><details><summary>Read the evidence and decisions</summary><ol class="timeline">'+r.events.map(e=>'<li class="event '+e.tone+'"><div class="eventhead">'+esc(e.type)+'</div><p>'+esc(e.text)+'</p></li>').join('')+'</ol></details></article>').join(''):'<p class="empty">Your first investigation will appear here.</p>')+'</section><section class="card"><h2>What “memory” means here</h2><p class="small muted">The model is not retrained. The controller loads saved evidence and prioritises the previous unresolved skill. Two later correct checks mark an earlier gap as improving, without declaring mastery.</p><p class="small muted">Retention checks compare answers across sessions. A weaker later response is a signal to investigate, not proof that time caused forgetting.</p><details><summary>Inspect the stored profile</summary><pre>'+esc(JSON.stringify(p,null,2))+'</pre></details></section></div></div>';}
function guide(){return title('Hackathon rehearsal','Show the agent changing its mind.','A reliable presentation path, with a real state machine and persistent memory.')+'<div class="dashgrid"><div><section class="card nextaction"><div class="label">One-click walkthrough</div><h2>The 20 m/s² mistake</h2><p class="small">Demo Mode supplies the wrong initial answer, answers the checks, confirms the supported gap, saves the profile, and begins a second encounter with an application check.</p>'+button('▷ Run Demo Mode','demo-start',true)+'<p class="toolbar-note">The scripted responses are always labelled. Pause at any point or advance one step at a time.</p></section><section class="card"><h2>The presentation sequence</h2><ol class="small muted"><li>Observe the wrong answer without guessing its cause.</li><li>Ask for the formula. “F = ma” contradicts the initial recall hypothesis.</li><li>Check division. “5” weakens the arithmetic explanation.</li><li>Ask how values were substituted, then test a new setup.</li><li>Present an application hypothesis with evidence.</li><li>Receive explicitly labelled scripted Yes confirmation.</li><li>Store the profile and begin a targeted second encounter.</li></ol></section><section class="card"><h2>Try to break it</h2><p class="small muted">In practice mode, choose “I’m not sure” repeatedly to reach the six-check stop. Reject a diagnosis to force revision. Refresh midway to resume the same question. Submit irrelevant text: the fallback records uncertainty rather than guessing.</p><p class="small muted">A live model response with invalid JSON is rejected, retried once and replaced by the reviewed fallback if it still fails. Retries count toward a separate model-call limit.</p></section></div><div><section class="card"><div class="label">AI connection</div><h2>'+ (state.service.configured?'Server-side AI is configured':'Live AI needs a server-side key')+'</h2><p class="small muted">'+(state.service.configured?'Select the AI-assisted engine when starting a practice investigation. Exact answer checks still take precedence over contradictory model output.':'The deterministic engine and Demo Mode work now. The AI integration is implemented, but requires a configured API key before live calls can run.')+'</p><p class="small muted">For the downloaded app, set <code>OPENAI_API_KEY</code> and <code>OPENAI_MODEL</code> in the local <code>.env</code> file, then restart. For the hosted app, configure them as server environment values and redeploy. Never enter a secret in a student answer.</p><div class="callout">AI suggests hypotheses, proposes question wording and interprets natural language. It cannot change counters, mark confirmation, or write the profile directly.</div><div class="backend-status" id="agent-backend-status"><span class="status-dot"></span><span>Checking agent backend…</span></div><p class="tiny">When live mode is enabled, submitted questions and answers are sent to the configured AI service. Use sample information for this demo.</p></section><section class="card"><h2>Scope & honest limits</h2><ul class="small muted"><li>Physics checks cover Newton’s second law and related skills.</li><li>The shared engine also supports study-friction self-reports.</li><li>Evidence confidence is qualitative; it is not a statistical probability.</li><li>A correct recall answer does not establish full concept mastery.</li><li>Profiles use a persistent browser identity, not a school login.</li><li>Resources appear only after an evidence-supported diagnosis is confirmed.</li></ul></section></div></div>';}
function render(){if(!state)return;$('#student-name').textContent=state.profile.name;$('#avatar').textContent=space==='demo'?'DS':'PS';$('#storage-label').textContent=state.service.storage;$('#switch-profile').textContent=space==='demo'?'Use practice profile':'Use demo profile';$('#service-badge').className='pill '+(state.service.configured?'green':'purple');$('#service-badge').textContent=state.service.configured?'AI available':'Reviewed engine · no AI key';$('#crumb').textContent='Learning space';document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false');});const keep=view;$('#app').innerHTML='<section id=overview-section class=scroll-section>'+overview()+'</section><section id=workspace-section class=scroll-section>'+workspace()+'</section><section id=memory-section class=scroll-section>'+memory()+'</section><section id=guide-section class=scroll-section>'+guide()+'</section>';const t=$('#timeline');if(t)t.scrollTop=t.scrollHeight;setTimeout(()=>document.getElementById(keep+'-section')?.scrollIntoView({behavior:'smooth',block:'start'}),0);}
async function startDemo(){auto=false;clearTimeout(autotimer);space='demo';history.replaceState(null,'','?profile=demo');window.newInvestigation=false;view='workspace';await load();const ok=await act({kind:'demo_start'});if(ok){auto=true;schedule();}}
function schedule(){clearTimeout(autotimer);if(!auto)return;if(state.run?.demo_encounter===2){auto=false;updateAutoControls();return;}updateAutoControls();autotimer=setTimeout(async()=>{if(!auto)return;const ok=await act({kind:'demo_step'});if(ok)schedule();},1700);}
function switchView(v){auto=false;clearTimeout(autotimer);view=v;document.getElementById(v+'-section')?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===v);b.setAttribute('aria-current',b.dataset.view===v?'page':'false');});}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.view){switchView(b.dataset.view);return;}if(b.dataset.module){selectedModule=b.dataset.module;window.newInvestigation=!state.run||state.run.state==='FINISH';if(!window.newInvestigation)showError('Finish or stop the current investigation before starting a different module.');switchView('workspace');render();return;}if(b.dataset.choice!==undefined){selectedChoice=Number(b.dataset.choice);$('#answer-text').value=selectedChoice===state.run.question.choices.length?'I’m not sure':state.run.question.choices[selectedChoice];document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));return;}if(b.dataset.confirm){auto=false;clearTimeout(autotimer);await act({kind:'confirm',value:b.dataset.confirm});return;}if(b.dataset.task){await act({kind:'task_done',task_id:b.dataset.task});return;}if(b.dataset.feedback){await act({kind:'feedback',intervention_id:b.dataset.id,value:b.dataset.feedback});return;}switch(b.dataset.action){case 'demo-start':await startDemo();break;case 'demo-toggle':auto=!auto;schedule();updateAutoControls();break;case 'demo-step':auto=false;clearTimeout(autotimer);await act({kind:'demo_step'});break;case 'switch-profile':auto=false;clearTimeout(autotimer);space=space==='demo'?'practice':'demo';history.replaceState(null,'','?profile='+space);window.newInvestigation=false;await load();break;case 'new':window.newInvestigation=true;render();break;case 'return':window.newInvestigation=false;await act({kind:'start',module:state.run.module,mode:state.run.mode==='live'?'live':'practice',question:state.run.input.question,attempt:state.run.input.attempt});break;case 'stop':auto=false;clearTimeout(autotimer);await act({kind:'stop'});break;case 'workspace':case 'memory':switchView(b.dataset.action);break;case 'reload':requestId=null;await load();break;case 'export':{const blob=new Blob([JSON.stringify(state.profile,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cognix-'+space+'-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}}});
document.addEventListener('input',e=>{if(e.target.id==='answer-text'){draft=e.target.value;selectedChoice=null;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));}});
document.addEventListener('change',e=>{if(e.target.id==='module-select'){selectedModule=e.target.value;render();}});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target);if(e.target.id==='start-form'){window.newInvestigation=false;const ok=await act({kind:'start',module:f.get('module'),question:f.get('question'),attempt:f.get('attempt'),mode:f.get('mode')});if(!ok)window.newInvestigation=true;}if(e.target.id==='answer-form'){auto=false;clearTimeout(autotimer);draft=f.get('answer');await act({kind:'answer',question_id:state.run.question.id,answer:draft,...(selectedChoice!==null?{choice:selectedChoice}:{})});}if(e.target.id==='task-form')await act({kind:'task',title:f.get('title'),due:f.get('due')});});
load();
setTimeout(checkAgentBackend,250);
</script></body></html>
