<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="COGNIX — a focused AI study companion that explains, diagnoses confusion and adapts.">
<title>COGNIX · Study Companion</title>
<style>
:root{color-scheme:light;--bg:#fff;--soft:#f7f9fb;--line:#e5e9ee;--text:#17202a;--muted:#6b7280;--accent:#2563eb;--accent-soft:#eff6ff;--user:#17202a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit}
.app{height:100%;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex:0 0 auto}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px}.mark{width:30px;height:30px;border-radius:9px;background:#111827;color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:0}.status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}.dot.off{background:#f59e0b}.chat{flex:1;overflow:auto}.inner{width:min(820px,calc(100% - 32px));margin:0 auto;padding:48px 0 150px}.welcome{text-align:center;padding:12vh 0 35px}.welcome h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 auto 30px;max-width:560px}.examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.example{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#4b5563;cursor:pointer;font-size:13px}.example:hover{border-color:#cbd5e1;background:var(--soft)}.message{display:flex;margin:28px 0}.message.user{justify-content:flex-end}.bubble{max-width:78%;white-space:normal}.user .bubble{background:var(--user);color:#fff;border-radius:18px 18px 4px 18px;padding:12px 16px}.assistant .bubble{padding:2px 0 2px 0}.assistant .bubble p:first-child{margin-top:0}.assistant .bubble p:last-child{margin-bottom:0}.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;margin-bottom:6px}.check{margin-top:15px;border:1px solid #bfdbfe;background:var(--accent-soft);border-radius:12px;padding:14px 16px}.check strong{display:block;margin-bottom:5px}.typing{display:inline-flex;gap:4px;padding:10px 0}.typing span{width:6px;height:6px;background:#9ca3af;border-radius:50%;animation:b 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}.composer-wrap{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#fff 28%);padding:34px 16px 18px}.composer{width:min(820px,100%);margin:auto;border:1px solid #d7dde5;border-radius:18px;background:#fff;box-shadow:0 8px 30px #11182712;padding:10px 12px;display:flex;align-items:flex-end;gap:10px}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:44px;max-height:180px;padding:9px 6px;color:var(--text);background:transparent}.send{border:0;background:#111827;color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer}.send:disabled{opacity:.35}.actions{width:min(820px,100%);margin:7px auto 0;display:flex;justify-content:flex-end}.clear{border:0;background:none;color:#9ca3af;font-size:12px;cursor:pointer}.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px 12px;border-radius:10px;margin:15px 0}.notice{font-size:12px;color:#9ca3af;text-align:center;margin-top:10px}@media(max-width:600px){.top{padding:0 15px}.inner{width:min(100% - 24px,820px);padding-top:20px}.welcome{padding-top:9vh}.welcome h1{font-size:34px}.bubble{max-width:90%}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><span class="mark">C</span>COGNIX</div><div class="status"><span class="dot" id="dot"></span><span id="status">Checking AI tutor…</span></div></header>
<main class="chat" id="chat"><div class="inner" id="messages">
<section class="welcome" id="welcome"><h1>What are you learning?</h1><p>Ask anything. COGNIX explains step by step and, when you're stuck, checks what is causing the confusion and adapts.</p><div class="examples"><button class="example">Explain recursion simply</button><button class="example">Why do derivatives use slope?</button><button class="example">Help me solve a physics problem</button></div></section>
</div></main>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="input" rows="1" placeholder="Ask anything about what you're studying…" autocomplete="off"></textarea><button class="send" id="send" type="submit" aria-label="Send">↑</button></form><div class="actions"><button class="clear" id="clear" type="button">New conversation</button></div><div class="notice">COGNIX is a study companion. Check important answers against your course material.</div></div>
</div>
<script>
const $=s=>document.querySelector(s);const messages=$('#messages'),input=$('#input'),send=$('#send'),status=$('#status'),dot=$('#dot'),welcome=$('#welcome');let busy=false;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function md(s){return esc(s).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');}
function add(role,text,check=''){welcome?.remove();const el=document.createElement('div');el.className='message '+role;el.innerHTML='<div class="bubble">'+(role==='assistant'?'<div class="label">COGNIX</div>':'')+'<p>'+md(text)+'</p>'+(check?'<div class="check"><strong>Quick check</strong>'+md(check)+'</div>':'')+'</div>';messages.appendChild(el);scroll();}
function typing(){const el=document.createElement('div');el.className='message assistant';el.id='typing';el.innerHTML='<div class="bubble"><div class="label">COGNIX</div><div class="typing"><span></span><span></span><span></span></div></div>';messages.appendChild(el);scroll();}
function scroll(){requestAnimationFrame(()=>$('#chat').scrollTop=$('#chat').scrollHeight);}
async function health(){try{const r=await fetch('/api/llm/health');const x=await r.json();status.textContent=x.configured?'AI tutor ready':'AI key not configured';dot.className='dot '+(x.configured?'':'off');}catch{status.textContent='Offline';dot.className='dot off';}}
async function ask(text){if(busy||!text.trim())return;busy=true;send.disabled=true;add('user',text);input.value='';input.style.height='auto';typing();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const x=await r.json();$('#typing')?.remove();if(!r.ok)throw new Error(x.error||'The tutor could not answer.');add('assistant',x.reply.response,x.reply.needs_check?x.reply.check_question:'');}catch(e){$('#typing')?.remove();const el=document.createElement('div');el.className='error';el.textContent=e.message;messages.appendChild(el);scroll();}finally{busy=false;send.disabled=false;input.focus();}}
$('#form').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px';});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit();}});document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));$('#clear').addEventListener('click',async()=>{await fetch('/api/chat/clear',{method:'POST'});messages.innerHTML='';messages.appendChild(welcome);input.focus();});health();input.focus();
</script>
</body></html>
